name: weTag CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Typecheck, Validate Schemas & Run Lifecycle Suites
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Microservice Dependencies
        run: |
          npm ci --prefix services/identity
          npm ci --prefix services/move
          npm ci --prefix services/stay
          npm ci --prefix services/wallet
          npm ci --prefix apps/admin

      - name: Validate & Generate Prisma Clients
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/wetag_test"
        run: |
          cd services/identity && npx prisma validate && npx prisma generate
          cd ../move && npx prisma validate && npx prisma generate
          cd ../stay && npx prisma validate && npx prisma generate
          cd ../wallet && npx prisma validate && npx prisma generate

      - name: Compile Backend Microservices & Admin (TypeScript)
        run: |
          cd services/identity && npx tsc --noEmit
          cd ../move && npx tsc --noEmit
          cd ../stay && npx tsc --noEmit
          cd ../wallet && npx tsc --noEmit
          cd ../../apps/admin && npx tsc --noEmit

      - name: Generate SEO/GEO Distribution Assets
        run: |
          cd services/move && npx ts-node ../../scripts/inject-seo-geo.ts

      - name: Run Master 7-Tier Quality & Security Audit Suite
        run: |
          cd services/move && npx ts-node src/master_test_runner.ts
