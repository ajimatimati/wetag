name: Build Android APK (Free Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project
        run: npx --yes expo prebuild -p android --no-install --clean

      - name: Patch Android Project
        run: python patch_gradle.py

      - name: Build Android APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25

      - name: Locate & Rename APK
        run: |
          mkdir -p ../../release-artifacts
          find . -name "*.apk"
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../../release-artifacts/weTag-Ibadan-v1.0.0.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: weTag Ibadan Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ### weTag (iTag) — Decentralized Local Life Operating Network (Ibadan)
            
            - **Target Corridors**: Akobo ➔ Agodi Secretariat, Dugbe Cocoa House Hub, UI Agbowo
            - **Features**: 4-Digit Drop-Off PIN, Offline Verification, Zero-Agent Direct Housing
            - **Build**: Standalone Android APK (Installs directly on any Android 8.0+ device)
          files: release-artifacts/weTag-Ibadan-v1.0.0.apk
