name: Build Android APK (Free Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project
        run: npx expo prebuild -p android --no-install

      - name: Build Android APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p ../../release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../../release-artifacts/weTag-Ibadan-v1.0.0.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: weTag Ibadan Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ### weTag (iTag) — Decentralized Local Life Operating Network (Ibadan)
            
            - **Target Corridors**: Akobo ➔ Agodi Secretariat, Dugbe Cocoa House Hub, UI Agbowo
            - **Features**: 4-Digit Drop-Off PIN, Offline Verification, Zero-Agent Direct Housing
            - **Build**: Standalone Android APK (Installs directly on any Android 8.0+ device)
          files: release-artifacts/weTag-Ibadan-v1.0.0.apk
